name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-arm64
    steps:
      - name: Where the Mac keeps Rust and Ely Office
        shell: bash
        run: |
          ls "$HOME/.cargo/bin" 2>/dev/null | head -5
          find "$HOME" -maxdepth 5 -type d -name ElyOffice -not -path "*/Library/*" 2>/dev/null | head -5
          for d in $(find "$HOME" -maxdepth 5 -type d -name ElyOffice -not -path "*/Library/*" 2>/dev/null | head -3); do
            echo "== $d"; ls "$d/engines" 2>/dev/null | tr '\n' ' '; echo; git -C "$d" log --oneline -1 2>/dev/null
            ls "$d/engines/lo-src/instdir/LibreOffice.app/Contents/Frameworks/libmergedlo.dylib" 2>/dev/null
          done
          security find-identity -v -p codesigning 2>/dev/null | head -3
