# GitHub's hosted runner: this fork has no self-hosted machine and builds in the cloud.
# Three apps, one setup.exe each, from packaging/windows/installer.nsi: NSIS has no
# ARM64 stub, so the setup itself is x64 while every installed program is arm64.
# ElyPDF's and ElyMark's worker links MuPDF, so the arm64 MuPDF and its static OpenSSL
# are built here too. Nothing else is bundled: no licence set, no source, no tessdata
# for OCR. ElyTree runs a system Git; none is in its setup.
name: windows-arm64
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
  ELY_APPS: ely-pdf ely-mark ely-tree
  # ring assembles its ARM64 code from .S files: clang, not cl.
  # cc picks the archiver, so lib.exe still writes the MSVC library.
  CC_aarch64_pc_windows_msvc: clang
jobs:
  build:
    # The image with the MSVC v143 toolset scripts/build-mupdf.sh names.
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: bash
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the host toolchain; its arm64 std is a separate download.
          rustup show
          rustup target add "$CARGO_BUILD_TARGET"
          rustup target list --installed
          clang --version | head -n 1

      - name: Registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: arm64-

      - name: Engine cache
        id: engines
        uses: actions/cache@v4
        with:
          path: |
            reference/mupdf
            engines/mupdf-build
            engines/vcpkg/installed
          key: engines-windows-2022-${{ hashFiles('scripts/fetch-references.sh', 'scripts/build-mupdf.sh', 'patches/mupdf/*.patch') }}

      - name: Engines
        if: steps.engines.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch-references.sh mupdf
          # --triplet, not openssl:arm64-…: MSYS would rewrite the colon form.
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl --triplet arm64-windows-static \
            --x-install-root="$(cygpath -w "$PWD/engines/vcpkg/installed")"
          scripts/build-mupdf.sh
          ls -l engines/mupdf-build

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          args=()
          lok=no
          pdf=no
          for slug in $ELY_APPS; do
            args+=(-p "$slug")
            # stage.sh's rule: an app takes the worker of the engine it links.
            grep -q '^ely-lok' "apps/$slug/Cargo.toml" && lok=yes
            grep -q '^ely-pdf-engine' "apps/$slug/Cargo.toml" && pdf=yes
          done
          cargo build --release --bins "${args[@]}"
          if [ "$lok" = yes ]; then
            cargo build --release -p ely-lok --bin ely-lok-worker
          fi
          if [ "$pdf" = yes ]; then
            cargo build --release -p ely-pdf-engine --bin ely-pdf-worker
          fi
          ls -l "target/$CARGO_BUILD_TARGET/release" | grep '\.exe$' || true

      - name: Architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem "target/$env:CARGO_BUILD_TARGET/release/*.exe" | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            $machine = '0x{0:X4}' -f [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
            "{0,-20} {1}" -f $_.Name, $machine
            if ($machine -ne '0xAA64') { throw "$($_.Name) is not ARM64" }
          }

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          release=target/$CARGO_BUILD_TARGET/release
          ls -d "/c/Program Files (x86)/NSIS" || true
          awk -F'"' '/^version = / { print "version=" $2; exit }' Cargo.toml >>"$GITHUB_OUTPUT"
          for slug in $ELY_APPS; do
            stage=$PWD/target/arm64/$slug
            rm -rf "$stage"
            mkdir -p "$stage"
            cp "$release/$slug.exe" "$stage/"
            if grep -q '^ely-pdf-engine' "apps/$slug/Cargo.toml"; then
              cp "$release/ely-pdf-worker.exe" "$stage/"
            fi
            cp LICENSE "$stage/"
            packaging/windows/installer.sh "$slug" "$stage"
          done
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ElyOffice-${{ steps.pkg.outputs.version }}-windows-arm64
          path: dist/*.exe
          compression-level: 6

      # A tag's release carries each app's setup as its own asset, to download direct.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/*.exe \
            --title "Ely Office $GITHUB_REF_NAME (Windows arm64)" \
            --notes="arm64 programs built by GitHub's runner with MSVC v143; the setup stub itself is x64, as NSIS has no ARM64 stub. ElyTree runs a system Git; ElyPDF needs tessdata beside it for OCR." \
            || gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
