# GitHub's hosted runner: this fork has no self-hosted machine and builds in the cloud.
# Every app in packaging/apps.tsv is cross-built, one zip each. ElyMark's and ElyPDF's
# worker links MuPDF, so the arm64 MuPDF and its static OpenSSL are built here too.
# The LibreOffice kernel is not: Doc, Table and Show still need an arm64 kernel beside them.
name: windows-arm64
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
  # ring assembles its ARM64 code from .S files: clang, not cl.
  # cc picks the archiver, so lib.exe still writes the MSVC library.
  CC_aarch64_pc_windows_msvc: clang
jobs:
  build:
    # The image with the MSVC v143 toolset scripts/build-mupdf.sh names.
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        shell: bash
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the host toolchain; its arm64 std is a separate download.
          rustup show
          rustup target add "$CARGO_BUILD_TARGET"
          rustup target list --installed
          clang --version | head -n 1

      - name: Registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: arm64-

      - name: Engine cache
        id: engines
        uses: actions/cache@v4
        with:
          path: |
            reference/mupdf
            engines/mupdf-build
            engines/vcpkg/installed
          key: engines-windows-2022-${{ hashFiles('scripts/fetch-references.sh', 'scripts/build-mupdf.sh', 'patches/mupdf/*.patch') }}

      - name: Engines
        if: steps.engines.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch-references.sh mupdf
          # --triplet, not openssl:arm64-…: MSYS would rewrite the colon form.
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl --triplet arm64-windows-static \
            --x-install-root="$(cygpath -w "$PWD/engines/vcpkg/installed")"
          scripts/build-mupdf.sh
          ls -l engines/mupdf-build

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          args=()
          lok=no
          pdf=no
          # packaging/apps.tsv is the app list: slug, name, categories, batch.
          while IFS=$'\t' read -r slug _; do
            [ -n "$slug" ] || continue
            args+=(-p "$slug")
            # stage.sh's rule: an app takes the worker of the engine it links.
            grep -q '^ely-lok' "apps/$slug/Cargo.toml" && lok=yes
            grep -q '^ely-pdf-engine' "apps/$slug/Cargo.toml" && pdf=yes
          done <packaging/apps.tsv
          cargo build --release --bins "${args[@]}"
          if [ "$lok" = yes ]; then
            cargo build --release -p ely-lok --bin ely-lok-worker
          fi
          if [ "$pdf" = yes ]; then
            cargo build --release -p ely-pdf-engine --bin ely-pdf-worker
          fi
          ls -l "target/$CARGO_BUILD_TARGET/release" | grep '\.exe$' || true

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          $release = "target/$env:CARGO_BUILD_TARGET/release"
          $workers = [ordered]@{ 'ely-lok' = 'ely-lok-worker'; 'ely-pdf-engine' = 'ely-pdf-worker' }
          $apps = Get-Content packaging/apps.tsv | Where-Object { $_.Trim() -ne '' } |
            ForEach-Object { $f = $_ -split "`t"; [pscustomobject]@{ slug = $f[0]; name = $f[1] } }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($app in $apps) {
            $slug = $app.slug
            $stage = "target/arm64/$slug"
            if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "$release/$slug.exe" $stage
            foreach ($engine in $workers.Keys) {
              if (Select-String "apps/$slug/Cargo.toml" -Pattern "^$engine" -Quiet) {
                Copy-Item "$release/$($workers[$engine]).exe" $stage
              }
            }
            Copy-Item LICENSE $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$($app.name)-$version-windows-arm64.zip"
          }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table
          # PowerShell 5.1's utf8 carries a BOM, which would prefix the key.
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ElyOffice-${{ steps.pkg.outputs.version }}-windows-arm64
          path: dist/*.zip
          compression-level: 0

      # A tag's release carries each app's archive as its own asset, to download direct.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
